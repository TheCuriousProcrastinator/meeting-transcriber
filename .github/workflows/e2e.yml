name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Transcription engine filter (WhisperKit, Parakeet, WatchLoop, or all)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - WhisperKit
          - Parakeet
          - WatchLoop
# PR runs land in their own group (github.ref = refs/pull/<n>/merge), so they
# can never cancel a main-push run (refs/heads/main is a distinct group).
# Within a PR group only `synchronize` (new commits) supersedes the in-flight
# run: `labeled` fires for ANY label addition, so cancelling on it would kill
# an in-flight run just because an unrelated label arrived. Push/dispatch
# events keep the old unconditional cancel (back-to-back main pushes
# supersede the stale run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' || github.event.action == 'synchronize' }}

jobs:
  e2e:
    # Non-PR events (push/dispatch) always run. PR events run only for
    # same-repo branches carrying the `run-e2e` label; the label-name check
    # keeps `labeled` events for any OTHER label from starting a duplicate.
    if: |
      github.event_name != 'pull_request' ||
      (
        contains(github.event.pull_request.labels.*.name, 'run-e2e') &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.action != 'labeled' || github.event.label.name == 'run-e2e')
      )
    runs-on: [self-hosted, macOS, ARM64]
    # Cold-cache runs download multi-GB models (WhisperKit ~1 GB,
    # Parakeet ~50 MB); hot runs <10 min. 30 min job
    # budget covers worst-case cold download. The `Run E2E tests` step
    # below has a 25 min step-timeout so a hang surfaces as `timed_out`
    # — see docs/plans/.local/open/2026-05-11-job-timeout-visibility.md.
    timeout-minutes: 30
    env:
      E2E_ENABLED: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/verify-xcode

      - name: Resolve test filter
        id: filter
        run: |
          ENGINE="${{ github.event.inputs.engine || 'all' }}"
          if [ "$ENGINE" = "all" ]; then
            FILTER="E2E"
          else
            FILTER="${ENGINE}E2E"
          fi
          echo "filter=$FILTER" >> "$GITHUB_OUTPUT"
          echo "Running E2E tests with filter: $FILTER"

      # No actions/cache here: the self-hosted Mini has persistent disk
      # between runs, so the SPM `.build` directory and the on-disk model
      # caches (~/Documents/huggingface, ~/Library/Application Support/
      # FluidAudio) are already populated. actions/cache would re-download
      # via HTTPS on hit and waste the multi-GB upload on miss — the
      # latter timed out the post-action on a real run (5.6 GB → GitHub).
      - name: Run E2E tests
        timeout-minutes: 25
        run: |
          cd app/MeetingTranscriber
          swift test --filter '${{ steps.filter.outputs.filter }}'
